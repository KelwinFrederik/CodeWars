<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Ranking mensal do clan BotosCodeWars"
    >

    <meta name="theme-color" content="#0b0d12">

    <title>BotosCodeWars</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="favicon.svg"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <header class="hero">

            <div class="brand-row">

                <div class="brand-symbol">
                    &lt;/&gt;
                </div>

                <div>
                    <span class="brand-label">
                        CLAN
                    </span>

                    <h1>BotosCodeWars</h1>
                </div>

            </div>

            <p>
                Ranking mensal por Honor conquistado
            </p>

        </header>


        <section class="season-card">

            <div class="season-top">

                <div>
                    <span class="section-label">
                        TEMPORADA ATUAL
                    </span>

                    <strong id="season-period">
                        Carregando...
                    </strong>
                </div>

                <button
                    id="refresh-button"
                    class="icon-button"
                    type="button"
                    aria-label="Atualizar ranking"
                    title="Atualizar ranking"
                >
                    ↻
                </button>

            </div>


            <div class="season-stats">

                <div>
                    <span>Jogadores</span>
                    <strong id="participants-count">-</strong>
                </div>

                <div>
                    <span>Líder</span>
                    <strong id="leader-name">-</strong>
                </div>

                <div>
                    <span>Restam</span>
                    <strong id="days-left">-</strong>
                </div>

            </div>

        </section>


        <section class="ranking-section">

            <div class="section-header">

                <div>
                    <span class="section-label">
                        CLASSIFICAÇÃO
                    </span>

                    <h2>Ranking</h2>
                </div>

                <span
                    id="last-update"
                    class="last-update"
                ></span>

            </div>


            <div
                id="ranking"
                class="ranking"
                aria-live="polite"
            >

                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>

            </div>

        </section>


        <section class="history-section">

            <button
                id="history-toggle"
                class="history-toggle"
                type="button"
                aria-expanded="false"
            >

                <div>
                    <span class="section-label">
                        TEMPORADAS
                    </span>

                    <h2>Histórico</h2>
                </div>

                <span class="history-arrow">
                    ↓
                </span>

            </button>


            <div
                id="history-content"
                class="history-content"
                hidden
            >

                <div id="history-list"></div>

            </div>

        </section>


        <footer>
            Honor atual − Honor inicial = pontos do mês
        </footer>

    </main>


    <script src="app.js"></script>

</body>
</html>
